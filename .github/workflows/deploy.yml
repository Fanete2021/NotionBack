name: Deploy backend

on:
  push: # Запускаем при пуше в любую ветку
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образа для деплоя (пусто = собрать текущий main)'
        required: false
        type: string

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  # 1. ПРОВЕРКА КОДА (Запускается ВСЕГДА при любом пуше: линт, типы, тесты и сборка)
  verify:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
    
      - name: Install dependencies
        run: npm ci
    
      - name: Generate Prisma Client
        run: npx prisma generate
    
      - name: Run Linter
        run: npm run lint
    
      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test
    
      - name: Run Nest Build
        run: npm run build
    
    # 2. СБОРКА DOCKER-ОБРАЗА
    build:
      name: Build & push image
      needs: verify
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      outputs:
        image: ${{ steps.vars.outputs.image }}
        tag: ${{ steps.vars.outputs.tag }}
      steps:
        - uses: actions/checkout@v4
    
        - id: vars
          run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    
        - uses: docker/setup-buildx-action@v3
    
        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
    
        - uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
              ${{ steps.vars.outputs.image }}:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max
    
    # 3. ДЕПЛОЙ НА СЕРВЕР (Только для ветки main или ручного запуска)
    deploy:
      name: Deploy to server
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: production
      steps:
        - name: Setup SSH
          run: |
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
   
        - name: Deploy
          env:
            TAG: ${{ inputs.tag || needs.build.outputs.tag }}
          run: |
            ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd ${{ secrets.DEPLOY_PATH }} && sed -i 's/\r$//' deploy.sh && ./deploy.sh $TAG"