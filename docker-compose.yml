services:
  postgres:
    image: postgres:16-alpine
    container_name: notionback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notionback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notionback"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notionback-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notionback?schema=public
      REDIS_HOST: redis
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
