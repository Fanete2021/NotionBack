# Сайт grafana.notiontv.ru.
# map должен лежать в контексте http. На Debian/Ubuntu этот файл подключают
# из sites-enabled, а sites-enabled уже внутри http — так и задумано.
# Имя переменной своё, чтобы не столкнуться с чужим $connection_upgrade.

map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name grafana.notiontv.ru;

    # Не проксировать проверку Let's Encrypt в Grafana.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $grafana_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
